<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração de Gerentes - Sonora</title>
    <link rel="stylesheet" href="style/midia.css">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-card {
            background: #2f3a4d;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .event-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .event-item {
            display: flex;
            align-items: center;
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
        }
        .event-item input {
            width: auto;
            margin-bottom: 0;
            margin-right: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logout-btn {
            background: #ef4444;
            width: auto;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ADMINISTRAÇÃO</h1>
            <button class="logout-btn" onclick="logout()">Sair</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-card">
                <h3>Cadastrar Novo Evento</h3>
                <form id="event-form">
                    <input type="text" id="event_name" placeholder="Nome do Evento" required>
                    <input type="date" id="start_date" required title="Data de Início">
                    <input type="date" id="end_date" required title="Data de Término">
                    <input type="text" id="location" placeholder="Local (Opcional)">
                    <button type="submit" id="save-event-btn">Cadastrar Evento</button>
                </form>
                <p id="event-status" style="margin-top: 15px;"></p>
            </div>

            <div class="form-card">
                <h3>Cadastrar Novo Gerente</h3>
                <form id="manager-form">
                    <input type="text" id="username" placeholder="Nome de Usuário (Login)" required>
                    <input type="email" id="email" placeholder="E-mail" required>
                    <input type="password" id="password" placeholder="Senha" required>
                    
                    <p>Selecione os Eventos:</p>
                    <div id="event-selection" class="event-list" style="max-height: 150px; overflow-y: auto;">
                        <!-- Events will be loaded here -->
                        Carregando eventos...
                    </div>

                    <button type="submit" id="save-btn">Cadastrar Gerente</button>
                </form>
                <p id="status" style="margin-top: 15px;"></p>
            </div>
        </div>

        <h3>Gerentes Existentes</h3>
        <div id="managers-list">
            <!-- Managers will be listed here -->
            Carregando gerentes...
        </div>
    </div>

    <!-- CERTIFIQUE-SE DE QUE O SEU api.js ESTÁ ATUALIZADO COM O IP DA SUA MÁQUINA -->
    <script src="js/api.js"></script>
    <script>
        // Check if admin
        const currentUser = getUser();
        if (!currentUser || !currentUser.is_admin) {
            window.location.href = 'login.html';
        }

        async function loadEvents() {
            try {
                const response = await apiRequest('/events/');
                // Previne quebra caso o Django use paginação (DRF retorna no formato { results: [...] })
                const events = response.results || response; 
                
                const container = document.getElementById('event-selection');
                container.innerHTML = '';
                
                if (!events || events.length === 0) {
                    container.innerHTML = 'Nenhum evento ativo encontrado.';
                    return;
                }

                events.forEach(event => {
                    const div = document.createElement('div');
                    div.className = 'event-item';
                    div.innerHTML = `
                        <input type="checkbox" name="events" value="${event.id}" id="ev-${event.id}">
                        <label for="ev-${event.id}">${event.event_name}</label>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('event-selection').innerHTML = 'Erro ao carregar eventos.';
            }
        }

        async function loadManagers() {
            try {
                const response = await apiRequest('/users/?managers=true');
                // Previne quebra caso o Django use paginação
                const managers = response.results || response;

                const container = document.getElementById('managers-list');
                container.innerHTML = '';

                if (!managers || managers.length === 0) {
                    container.innerHTML = 'Nenhum gerente encontrado.';
                    return;
                }

                managers.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    let eventsHtml = '';
                    if (m.my_events && m.my_events.length > 0) {
                        eventsHtml = '<p>Eventos vinculados: ' + m.my_events.map(e => e.event_name).join(', ') + '</p>';
                    } else {
                        eventsHtml = '<p>Nenhum evento vinculado.</p>';
                    }

                    card.innerHTML = `
                        <div class="enviado">GERENTE: ${m.username.toUpperCase()}</div>
                        <div class="obs">Email: ${m.email}</div>
                        ${eventsHtml}
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('managers-list').innerHTML = 'Erro ao carregar gerentes.';
            }
        }

        document.getElementById('event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('event-status');
            const btn = document.getElementById('save-event-btn');
            
            const event_name = document.getElementById('event_name').value;
            const start_date = document.getElementById('start_date').value;
            const end_date = document.getElementById('end_date').value;
            const location = document.getElementById('location').value;

            status.innerText = 'Processando...';
            status.style.color = 'white';
            btn.disabled = true;

            try {
                await apiRequest('/events/', 'POST', {
                    event_name,
                    start_date,
                    end_date,
                    location
                });

                status.innerText = 'Evento cadastrado com sucesso!';
                status.style.color = '#22c55e';
                document.getElementById('event-form').reset();
                loadEvents(); // Atualiza a lista de seleção de eventos do gerente
            } catch (err) {
                status.innerText = 'Erro: ' + err.message;
                status.style.color = '#ef4444';
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('manager-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const btn = document.getElementById('save-btn');
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const selectedEvents = Array.from(document.querySelectorAll('input[name="events"]:checked'))
                .map(cb => parseInt(cb.value)); // Convertendo o ID para Int por garantia pro Django

            status.innerText = 'Processando...';
            status.style.color = 'white';
            btn.disabled = true;

            try {
                await apiRequest('/users/', 'POST', {
                    username,
                    email,
                    password,
                    is_manager: true,
                    event_ids: selectedEvents,
                    plan: 'experimentacao'
                });

                status.innerText = 'Gerente cadastrado com sucesso!';
                status.style.color = '#22c55e';
                document.getElementById('manager-form').reset();
                loadManagers(); // Atualiza a lista de gerentes na tela
            } catch (err) {
                status.innerText = 'Erro: ' + err.message;
                status.style.color = '#ef4444';
            } finally {
                btn.disabled = false;
            }
        });

        // Inicializa a página
        loadEvents();
        loadManagers();
    </script>
</body>
</html>
