<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ZionBridge</title>

    <link rel="stylesheet" href="style/style.css">

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

    <div class="app">

        <h2>ZionBridge</h2>
        <p>Enviar Playback</p>

        <form id="form">

            <input type="text" id="nomep_play" placeholder="Seu nome" required>

            <select id="evento_play" required>

                <option value="">Evento</option>

                <option>Culto de Terça</option>

                <option>Culto de Quinta</option>

                <option>Culto de Domingo</option>

                <option>Culto de Evento</option>

            </select>

            <div id="musicas"></div>

            <button type="button" id="add">
                + Adicionar música
            </button>

            <button type="submit">
                Enviar Playbacks
            </button>

        </form>

        <div id="loading" class="hidden">

            <div class="loader"></div>

            <p>Enviando...</p>

        </div>

        <p id="status"></p>

    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/upload.js"></script>

</body>

</html>
